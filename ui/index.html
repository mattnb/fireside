<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>fireside</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <header class="brand">
        <svg class="brand__flame" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 2c.5 3 2.5 4.6 4 6.4 1.6 1.9 2.5 3.7 2.5 6.1A6.5 6.5 0 0 1 12 21a6.5 6.5 0 0 1-6.5-6.5c0-2.4.9-4.2 2.5-6.1.6-.7 1.2-1.5 1.7-2.4.4 1.7 1.3 2.6 2.3 3 .1-2 0-4-1-7Z" fill="currentColor"/>
          <path d="M12 21a3.5 3.5 0 0 1-3.5-3.5c0-1.4.7-2.5 1.7-3.6.3-.3.6-.7.8-1.1.3.9.8 1.4 1.4 1.6.1-.9 0-1.8-.4-3 .8 1.3 1.5 2.1 2.2 3 .8.9 1.3 1.7 1.3 3.1A3.5 3.5 0 0 1 12 21Z" fill="rgba(255,255,255,0.55)"/>
        </svg>
        <span class="brand__word">fireside</span>
      </header>

      <div class="rooms">
        <div class="rooms__label">rooms</div>
        <ol id="room-list" class="rooms__list" aria-label="Rooms"></ol>
        <button id="new-room-btn" class="rooms__new" type="button">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          new room
        </button>
      </div>

      <footer class="me">
        <div id="me-avatar" class="avatar avatar--me" aria-hidden="true"></div>
        <div class="me__id">
          <input id="author-input" class="me__name" type="text" autocomplete="off" spellcheck="false" />
          <span class="me__status"><span class="dot dot--online" aria-hidden="true"></span>connected</span>
        </div>
      </footer>
    </aside>

    <main class="chat">
      <header class="channel">
        <div class="channel__title">
          <span class="channel__hash" aria-hidden="true">#</span>
          <span id="channel-name" class="channel__name">no room selected</span>
        </div>
        <div id="channel-agents" class="channel__agents" aria-label="Agents in this room"></div>
      </header>

      <ol id="message-list" class="messages" aria-live="polite" aria-label="Messages"></ol>

      <div class="composer">
        <form id="composer" class="composer__form">
          <input
            id="message-input"
            class="composer__input"
            type="text"
            autocomplete="off"
            placeholder="message #general"
            aria-label="Message"
          />
          <button id="send-btn" class="composer__send" type="submit" aria-label="Send">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 16V4M4 10l6-6 6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
          </button>
        </form>
        <div class="composer__hint">use <kbd>@claude</kbd> <kbd>@codex</kbd> <kbd>@gemini</kbd> to address one agent</div>
      </div>
    </main>
  </div>

  <div id="modal" class="modal" hidden>
    <div class="modal__scrim" data-close></div>
    <div class="modal__panel" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <header class="modal__head">
        <h2 id="modal-title" class="modal__title">create a room</h2>
        <p class="modal__sub">rooms are persistent. you choose which agents can listen in.</p>
      </header>
      <form id="new-room-form" class="modal__form">
        <label class="field">
          <span class="field__label">room name</span>
          <input id="new-room-name" class="field__input" type="text" autocomplete="off" placeholder="general" required />
        </label>
        <fieldset class="agents">
          <legend class="field__label">agents</legend>
          <label class="agent-toggle" data-id="claude">
            <input type="checkbox" name="agent" value="claude" checked />
            <span class="agent-toggle__chip">
              <span class="avatar avatar--claude">C</span>
              <span class="agent-toggle__name">claude</span>
            </span>
          </label>
          <label class="agent-toggle" data-id="codex">
            <input type="checkbox" name="agent" value="codex" checked />
            <span class="agent-toggle__chip">
              <span class="avatar avatar--codex">X</span>
              <span class="agent-toggle__name">codex</span>
            </span>
          </label>
          <label class="agent-toggle" data-id="gemini">
            <input type="checkbox" name="agent" value="gemini" checked />
            <span class="agent-toggle__chip">
              <span class="avatar avatar--gemini">G</span>
              <span class="agent-toggle__name">gemini</span>
            </span>
          </label>
        </fieldset>
        <footer class="modal__foot">
          <button type="button" class="btn btn--ghost" data-close>cancel</button>
          <button type="submit" class="btn btn--primary">light it up</button>
        </footer>
      </form>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
