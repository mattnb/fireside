<form
  class="composer"
  (submit)="$event.preventDefault(); submit(messageInput)"
>
  <button
    class="control-btn control-btn--icon composer__attach"
    type="button"
    title="Attach file"
    aria-label="Attach file"
    (click)="attachRequested.emit(messageInput)"
  >
    <svg viewBox="0 0 20 20" aria-hidden="true">
      <path
        d="M7.5 10.5 12 6a2.5 2.5 0 0 1 3.5 3.5l-6.2 6.2a4 4 0 0 1-5.7-5.7l6.4-6.4a5.5 5.5 0 0 1 7.8 7.8l-6 6"
        fill="none"
        stroke="currentColor"
        stroke-width="1.6"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  </button>
  <textarea
    #messageInput
    class="composer__input"
    rows="1"
    autocomplete="off"
    spellcheck="true"
    [placeholder]="placeholder()"
    aria-label="Message"
    [attr.aria-expanded]="suggestions().length > 0"
    aria-controls="mention-autocomplete"
    (input)="onInput(messageInput)"
    (click)="refreshAutocomplete(messageInput)"
    (keydown)="onKeydown($event, messageInput)"
    (blur)="closeAutocompleteSoon()"
  ></textarea>
  @if (suggestions().length > 0) {
  <div id="mention-autocomplete" class="mention-menu" role="listbox">
    @for (suggestion of suggestions(); track suggestion.agentId; let index = $index) {
    <button
      type="button"
      class="mention-menu__item"
      [class.is-active]="index === selectedIndex()"
      role="option"
      [attr.aria-selected]="index === selectedIndex()"
      (mouseenter)="selectedIndex.set(index)"
      (mousedown)="$event.preventDefault(); applySuggestion(messageInput, suggestion)"
    >
      <span [class]="display.avatarClass(suggestion.agentId, 'sm')"></span>
      <span class="mention-menu__body">
        <strong>{{ suggestion.label }}</strong>
        <small>{{ suggestion.detail }}</small>
      </span>
      <code>@{{ suggestion.handle }}</code>
    </button>
    }
  </div>
  }
  @if (isWorking()) {
  <button
    class="control-btn control-btn--icon composer__stop"
    type="button"
    title="Stop active agent runs"
    aria-label="Stop active agent runs"
    (click)="stopRequested.emit()"
  >
    <svg viewBox="0 0 640 640" aria-hidden="true">
      <path
        d="M160 96L480 96C515.3 96 544 124.7 544 160L544 480C544 515.3 515.3 544 480 544L160 544C124.7 544 96 515.3 96 480L96 160C96 124.7 124.7 96 160 96z"
        fill="currentColor"
      />
    </svg>
  </button>
  }
  <button
    class="control-btn control-btn--icon control-btn--primary composer__send"
    type="submit"
    title="Send message"
    aria-label="Send message"
  >
    <svg viewBox="0 0 640 640" aria-hidden="true">
      <path
        d="M568.4 37.7C578.2 34.2 589 36.7 596.4 44C603.8 51.3 606.2 62.2 602.7 72L424.7 568.9C419.7 582.8 406.6 592 391.9 592C377.7 592 364.9 583.4 359.6 570.3L295.4 412.3C290.9 401.3 292.9 388.7 300.6 379.7L395.1 267.3C400.2 261.2 399.8 252.3 394.2 246.7C388.6 241.1 379.6 240.7 373.6 245.8L261.2 340.1C252.1 347.7 239.6 349.7 228.6 345.3L70.1 280.8C57 275.5 48.4 262.7 48.4 248.5C48.4 233.8 57.6 220.7 71.5 215.7L568.4 37.7z"
        fill="currentColor"
      />
    </svg>
  </button>
</form>
