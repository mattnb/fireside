<aside class="sidebar">
  <nav class="primary-nav" aria-label="Workspace navigation">
    <button
      type="button"
      class="primary-nav__item"
      [class.is-active]="isBriefingsActive()"
      (click)="briefingsOpened.emit()"
    >
      <span>briefings</span>
      <strong>{{ briefingsCount() }}</strong>
    </button>
    <button
      type="button"
      class="primary-nav__item"
      [class.is-active]="isArchivesActive()"
      (click)="archivesOpened.emit()"
    >
      <span>archives</span>
      <strong>{{ archivesCount() }}</strong>
    </button>
  </nav>

  <nav class="rooms" aria-label="Projects">
    @if (!vfxPaused()) {
    <vfx-smoke-and-embers class="rooms__vfx"></vfx-smoke-and-embers>
    }
    <div class="rooms__head">
      <div class="rooms__label">projects</div>
      <button
        type="button"
        class="rooms__add"
        [class.is-active]="creatingProject()"
        title="New project"
        aria-label="New project"
        (click)="createProjectToggled.emit()"
      >
        <svg viewBox="0 0 20 20" aria-hidden="true">
          <path
            d="M10 4v12M4 10h12"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
          />
        </svg>
      </button>
    </div>
    @if (creatingProject()) {
    <form
      class="room-create project-create"
      (submit)="$event.preventDefault(); projectSubmitted.emit(projectName)"
    >
      <input
        #projectName
        class="room-create__input"
        type="text"
        autocomplete="off"
        placeholder="project name"
        aria-label="Project name"
      />
      <div class="room-create__actions">
        <button class="control-btn control-btn--primary" type="submit">create project</button>
        <button
          class="control-btn"
          type="button"
          (click)="projectCreationCanceled.emit(projectName)"
        >
          cancel
        </button>
      </div>
    </form>
    } @for (group of projectGroups(); track group.project.id) {
    <section
      class="project-group"
      [class.is-active]="
        group.project.id === selectedProjectId() && !selectedRoomId()
      "
    >
      <header class="project-group__head">
        <button
          type="button"
          class="project-pill"
          (click)="projectSelected.emit(group.project.id)"
        >
          <span class="project-pill__icon">&gt;</span>
          <span class="project-pill__name">{{ group.project.name }}</span>
          <span class="project-pill__count">{{ group.missions.length }}</span>
        </button>
        <div class="project-group__actions">
          @if (canManageProject(group.project)) {
          <button
            type="button"
            class="project-action project-action--archive"
            title="Archive project"
            aria-label="Archive project"
            (click)="projectArchived.emit(group.project)"
          >
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <path
                d="M3 6h14M5 6v9a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V6M8 9h4"
                fill="none"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
          <button
            type="button"
            class="project-action project-action--delete"
            title="Delete project"
            aria-label="Delete project"
            (click)="projectDeleted.emit(group.project)"
          >
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <path
                d="M5 6h10M8 6V4h4v2M6 6v10a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V6M9 9v6M11 9v6"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
          }
          <button
            type="button"
            class="rooms__add rooms__add--mission"
            [class.is-active]="creatingMissionProjectId() === group.project.id"
            title="New mission"
            aria-label="New mission"
            (click)="roomCreationToggled.emit(group.project.id)"
          >
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <path
                d="M10 4v12M4 10h12"
                fill="none"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
              />
            </svg>
          </button>
        </div>
      </header>
      @for (room of group.missions; track room.id) {
      <div
        class="room-row"
        [class.is-active]="room.id === selectedRoomId() && !isBriefingsActive()"
      >
        <button type="button" class="room-pill" (click)="roomSelected.emit(room.id)">
          <span class="room-pill__hash">#</span>
          <span class="room-pill__name">{{ room.name }}</span>
          @if (drafts.hasDraft(room.id)) {
          <span
            class="room-pill__draft-dot"
            aria-label="Unsent draft"
            title="You have an unsent draft in this room"
          ></span>
          }
          <span class="room-pill__count">{{ room.agents.length }}</span>
        </button>
        <button
          type="button"
          class="room-pill__delete"
          title="Delete mission"
          aria-label="Delete mission"
          (click)="$event.stopPropagation(); roomDeleted.emit(room)"
        >
          x
        </button>
      </div>
      } @empty {
      <p class="project-group__empty">no missions yet</p>
      }
    </section>
    } @empty {
    <p class="empty-copy">no projects yet</p>
    }
  </nav>

  <div class="me" [class.is-menu-open]="settingsOpen()">
    <button
      type="button"
      class="me__settings"
      title="Settings"
      aria-label="Settings"
      aria-haspopup="menu"
      [attr.aria-expanded]="settingsOpen()"
      (click)="toggleSettingsMenu($event)"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path
          d="M12 15.4a3.4 3.4 0 1 0 0-6.8 3.4 3.4 0 0 0 0 6.8Z"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
        />
        <path
          d="M19.3 13.5c.1-.5.1-1 .1-1.5s0-1-.1-1.5l2-1.5-2-3.5-2.4 1a8 8 0 0 0-2.6-1.5L14 2.4h-4l-.4 2.6A8 8 0 0 0 7 6.5l-2.4-1-2 3.5 2 1.5c-.1.5-.1 1-.1 1.5s0 1 .1 1.5l-2 1.5 2 3.5 2.4-1a8 8 0 0 0 2.6 1.5l.4 2.6h4l.4-2.6a8 8 0 0 0 2.6-1.5l2.4 1 2-3.5-2.1-1.5Z"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linejoin="round"
        />
      </svg>
    </button>
    @if (settingsOpen()) {
    <div class="me-menu" role="menu">
      <label class="me-menu__check">
        <input
          type="checkbox"
          [checked]="!vfxPaused()"
          (change)="setCampfireGraphicEnabled($any($event.target).checked)"
        />
        <span>Campfire graphic</span>
      </label>
    </div>
    }
    <input
      #authorInput
      class="me__name"
      type="text"
      autocomplete="off"
      spellcheck="false"
      [value]="authorName()"
      aria-label="Your name"
      (blur)="authorChanged.emit(authorInput)"
      (keydown.enter)="authorChanged.emit(authorInput)"
    />
  </div>
</aside>
